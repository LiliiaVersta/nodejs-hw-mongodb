tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact for the authenticated user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the contact
          phoneNumber:
            type: string
            description: Phone number of the contact
          email:
            type: string
            format: email
            description: Email of the contact
          contactType:
            type: string
            description: Type of the contact (e.g., personal, work)
          photo:
            type: string
            format: binary
            description: Profile photo of the contact
responses:
  201:
    description: Successfully created the contact
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  400:
    description: Bad request
