tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact in the system, including a profile photo if provided
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Full name of the contact
            example: John Doe
          phoneNumber:
            type: string
            description: Phone number of the contact
            example: '+123456789'
          email:
            type: string
            description: Email of the contact (optional)
            format: email
            example: john.doe@example.com
          isFavourite:
            type: boolean
            description: Mark the contact as favourite (optional)
            example: false
          contactType:
            type: string
            description: Type of contact
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
            description: Profile photo of the contact (optional)
responses:
  '201':
    description: Successfully created the contact
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request data
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
