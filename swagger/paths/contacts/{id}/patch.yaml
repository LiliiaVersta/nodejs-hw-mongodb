tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Update specific fields of a contact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: ID of the contact to update
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/Contact.yaml
responses:
  '200':
    description: Successfully updated the contact
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Contact.yaml
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request data
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
