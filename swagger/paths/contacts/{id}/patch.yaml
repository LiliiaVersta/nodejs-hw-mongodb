tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Update specific fields of a contact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: ID of the contact to update
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Updated name of the contact
            example: Jane Doe
          phoneNumber:
            type: string
            description: Updated phone number of the contact
            example: '+987654321'
          email:
            type: string
            description: Updated email of the contact (optional)
            format: email
            example: jane.doe@example.com
          isFavourite:
            type: boolean
            description: Mark the contact as favourite (optional)
            example: false
          contactType:
            type: string
            description: Updated type of the contact
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
            description: Updated profile photo of the contact (optional)
      encoding:
        photo:
          contentType: image/jpeg
responses:
  '200':
    description: Successfully updated the contact
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Contact.yaml
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request data
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
